<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Red Light Racing (RLR) — F1 2020 league</title>
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Orbitron:wght@700;900&family=Golos+Text:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--black:#000;--asphalt:#141414;--line:#2a2a2a;--red:#e3001b;--hot:#ff2a3d;--deep:#6b000e;--bone:#f2f2f2;--grey:#a3a3a3;
--display:"Orbitron",sans-serif;--body:"Golos Text","Segoe UI",Roboto,Arial,sans-serif;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--black);color:var(--bone);font:400 1.05rem/1.6 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#000;z-index:20}
a{color:inherit}
:focus-visible{outline:3px solid var(--hot);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(0,0,0,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:18px;height:62px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;font:900 1.4rem var(--display);letter-spacing:1px;flex:none}
.mark{width:38px;height:38px;display:block;object-fit:contain;border-radius:6px}
nav{display:flex;gap:20px;overflow-x:auto;white-space:nowrap;min-width:0;scrollbar-width:none}
nav a{text-decoration:none;color:var(--grey);font-weight:600;font-size:.95rem;padding:6px 0;border-bottom:2px solid transparent}
nav a:hover{color:var(--bone);border-color:var(--red)}
nav a.cta{color:#fff;background:var(--red);padding:6px 14px;border-radius:6px;border:0}

.hero{position:relative;overflow:hidden;padding:44px 0 80px;
background:radial-gradient(circle at 88% 8%,rgba(227,0,27,.38),transparent 45%),
linear-gradient(115deg,transparent 0 72%,var(--red) 72% 73.5%,transparent 73.5% 76%,var(--deep) 76% 77%,transparent 77%),
repeating-linear-gradient(45deg,#0c0c0c 0 3px,#000 3px 6px)}
.lights{display:flex;gap:10px;margin-bottom:26px}
.pod{background:var(--asphalt);border:2px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:8px}
.bulb{width:clamp(22px,6vw,34px);aspect-ratio:1;border-radius:50%;background:#2a0006;animation:on .01s var(--d) forwards,off .01s 3.4s forwards}
@keyframes on{to{background:var(--hot);box-shadow:0 0 18px 4px rgba(227,0,27,.75)}}
@keyframes off{to{background:#2a0006;box-shadow:none}}
h1{font:900 clamp(4.5rem,24vw,12rem)/.85 var(--display);margin:0;color:#e9ecef;letter-spacing:-2px;
background:linear-gradient(180deg,#fff 5%,#8f959d 55%,#eceff2 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 5px 0 var(--deep))}
.streak{height:4px;width:min(100%,560px);background:linear-gradient(90deg,var(--hot),transparent);box-shadow:0 0 24px 3px rgba(227,0,27,.6);margin:18px 0 22px}
.tag{font:700 clamp(1.1rem,3.2vw,1.6rem)/1.2 var(--display);margin:0 0 12px;max-width:30ch;color:var(--bone)}
.lead{color:var(--grey);max-width:54ch;margin:0 0 30px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;padding:14px 26px;border-radius:6px;font-weight:600;text-decoration:none;border:2px solid var(--red)}
.btn.main{background:linear-gradient(var(--hot),var(--red));color:#fff;box-shadow:0 6px 24px rgba(227,0,27,.35)}
.btn.main:hover{background:var(--hot)}
.btn.alt:hover{background:var(--deep)}

section{padding:68px 0;border-top:1px solid var(--line)}
h2{font:700 clamp(1.6rem,4.5vw,2.3rem)/1.1 var(--display);margin:0 0 8px;display:flex;align-items:center;gap:14px}
h2::before{content:"";flex:none;width:34px;height:20px;background:conic-gradient(var(--red) 25%,#000 0 50%,var(--red) 0 75%,#000 0) 0 0/10px 10px;border:1px solid var(--red)}
.sub{color:var(--grey);margin:0 0 30px;max-width:60ch}

.rules{list-style:none;margin:0 0 28px;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.rules li{padding:18px 20px;border-left:4px solid var(--red);border-radius:0 10px 10px 0;background:linear-gradient(90deg,#1b1b1b,var(--asphalt))}
.rules strong{display:block;font:700 1.05rem var(--display);margin-bottom:4px;letter-spacing:0.5px}
.rules span{color:var(--grey)}
.reg-box{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;padding:22px 24px;border:2px solid var(--red);border-radius:12px;background:linear-gradient(100deg,var(--deep),#120003 70%)}
.reg-box b{font:700 1.2rem var(--display);display:block}
.reg-box span{color:#d9b8bd}

.cal{list-style:none;margin:0;padding:0;display:grid;gap:10px 32px}
.cal li{display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.cal .r{width:48px;height:48px;border-radius:10px;display:grid;place-items:center;font:700 1.2rem var(--display);color:#fff;background:linear-gradient(var(--hot),#b3000f)}
.cal .g{font-weight:600}
.cal .t{display:block;color:var(--grey);font-size:.9rem;font-weight:400}
.cal .d{color:var(--grey);font-size:.9rem;text-align:right}
.cal li.done .r{opacity:.45}
.cal li.done .g{color:var(--grey)}
.cal li.next .r{box-shadow:0 0 18px 3px rgba(227,0,27,.7)}
.cal li.next .d{color:var(--bone);font-weight:600}
@media(min-width:860px){.cal{grid-template-columns:1fr 1fr;grid-template-rows:repeat(9,auto);grid-auto-flow:column}}
.weekend{display:grid;grid-template-columns:1fr 1fr;margin-top:34px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--asphalt)}
.weekend div{padding:18px 22px}
.weekend div+div{border-left:3px solid var(--red)}
.weekend small{color:var(--hot);font-weight:600;display:block}
.weekend b{font:700 1.1rem var(--display);display:block}
.weekend em{font:900 1.8rem/1.1 var(--display)}

.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{font:600 1rem var(--body);color:var(--grey);background:none;border:2px solid var(--line);border-radius:999px;padding:9px 22px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--red);border-color:var(--red);color:#fff}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--asphalt)}
table{width:100%;border-collapse:collapse;min-width:520px}
th,td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--grey);font-size:.9rem;border-bottom:2px solid var(--red)}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#1d1d1d}
td.n{font:700 1rem var(--display);color:var(--hot);width:3.2rem}
td.no{color:var(--grey);width:3rem}
td.pts,th.pts{text-align:right;font-family:var(--display);font-weight:700}
th.pts{font-family:var(--body);font-weight:600}
tbody tr:nth-child(2) td.n{color:#c9ced6}
tbody tr:nth-child(3) td.n{color:#cd7f32}
tbody tr:first-child td{background:linear-gradient(90deg,var(--deep),transparent)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}

.steps{list-style:none;margin:0 0 32px;padding:0;counter-reset:s;display:grid;gap:14px}
.steps li{counter-increment:s;display:grid;grid-template-columns:2.8rem 1fr;gap:14px;align-items:start}
.steps li::before{content:counter(s);font:900 1.2rem/1 var(--display);background:linear-gradient(var(--hot),#b3000f);color:#fff;width:2.8rem;height:2.8rem;display:grid;place-items:center;border-radius:10px}
.steps p{margin:0;padding-top:8px}

footer{border-top:1px solid var(--line);padding:30px 0 40px;color:var(--grey)}
footer .wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
footer .mark{width:44px;height:44px;object-fit:contain;border-radius:6px}
footer nav{margin-left:auto}
.check{height:10px;background:conic-gradient(#fff 25%,#000 0 50%,#fff 0 75%,#000 0) 0 0/10px 10px}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.bulb{animation:none}}
@media(max-width:560px){.cal li{grid-template-columns:48px 1fr}.cal .d{grid-column:2;text-align:left}.brand span{display:none}.weekend em{font-size:1.5rem}}
</style>
</head>
<body>

<header class="top"><div class="wrap bar">

 
  <a class="brand" href="#top" aria-label="RLR, top"><img class="mark" src="logo.png" alt="RLR Logo"><span>RLR</span></a>
  <nav aria-label="Sections">
    <a href="#rules">Правила</a><a class="reg" href="#" target="_blank" rel="noopener">Регламент</a><a href="#calendar">Календарь</a><a href="#standings">Зачёт</a><a class="cta discord" href="#">Discord</a>
  </nav>
</div></header>

<main id="top">
  <div class="hero"><div class="wrap">
    <div class="lights" aria-hidden="true">
      <div class="pod"><i class="bulb" style="--d:.4s"></i><i class="bulb" style="--d:.4s"></i></div>
      <div class="pod"><i class="bulb" style="--d:1s"></i><i class="bulb" style="--d:1s"></i></div>
      <div class="pod"><i class="bulb" style="--d:1.6s"></i><i class="bulb" style="--d:1.6s"></i></div>
      <div class="pod"><i class="bulb" style="--d:2.2s"></i><i class="bulb" style="--d:2.2s"></i></div>
      <div class="pod"><i class="bulb" style="--d:2.8s"></i><i class="bulb" style="--d:2.8s"></i></div>
    </div>
    <h1>RLR</h1>
    <div class="streak" aria-hidden="true"></div>
    <!-- Переведенная на английский язык строчка с третьего фото -->
    <p class="tag">Red Light Racing, F1 2020 league</p>
